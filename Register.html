<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Roblox Code Shop</title>

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>


<div class="register-container">

    <div class="register-box">


        <div class="register-logo">
            ROBLOX
            <span>CODE SHOP</span>
        </div>


        <h1>
            CREATE ACCOUNT
        </h1>


        <p class="subtitle">
            สร้างบัญชีใหม่
        </p>


        <form id="registerForm">


            <label>
                Username
            </label>


            <input
                type="text"
                id="registerUsername"
                placeholder="Username"
                autocomplete="username"
                required
            >


            <label>
                Email
            </label>


            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
                autocomplete="email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
                autocomplete="new-password"
                required
            >


            <label>
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="ยืนยัน Password"
                autocomplete="new-password"
                required
            >


            <label class="terms">

                <input
                    type="checkbox"
                    id="terms"
                >

                <span>
                    ฉันยอมรับเงื่อนไขการใช้งาน
                </span>

            </label>


            <button
                type="submit"
                class="register-button"
            >
                CREATE ACCOUNT
            </button>


        </form>


        <div class="bottom-text">

            มีบัญชีอยู่แล้ว?

            <a href="login.html">
                Login
            </a>

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← กลับหน้าหลัก
        </a>


    </div>

</div>



<script src="script.js"></script>

</body>

</html>
