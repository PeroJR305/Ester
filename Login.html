<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Roblox Code Shop</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


<div class="login-container">

    <div class="login-box">


        <div class="login-logo">
            ROBLOX
            <span>CODE SHOP</span>
        </div>


        <h1>
            LOGIN
        </h1>


        <p class="subtitle">
            เข้าสู่ระบบบัญชีของคุณ
        </p>


        <form id="loginForm">


            <label>
                Username หรือ Email
            </label>


            <input
                type="text"
                id="loginUsername"
                placeholder="Username หรือ Email"
                autocomplete="username"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>


        </form>


        <div class="bottom-text">

            ยังไม่มีบัญชี?

            <a href="register.html">
                สมัครสมาชิก
            </a>

        </div>


        <a
            href="index.html"
            class="back-home"
        >
            ← กลับหน้าหลัก
        </a>


    </div>

</div>



<script src="script.js"></script>

</body>

</html>
